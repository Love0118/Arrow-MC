name: foundations

on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Verify native architecture
        shell: bash
        run: |
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Debug tests
        run: cargo test --locked --all-targets
      - name: Release tests and build timings
        run: cargo test --locked --release --all-targets --timings

  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python tooling tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify pinned Unicode data generation
        run: python3 tools/generate_unicode_names.py --check
