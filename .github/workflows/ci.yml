name: foundations

on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native Windows OpenSSL build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = & ./tools/Prepare-WindowsBuild.ps1
          "OPENSSL_SRC_PERL=$($tools.Perl)" >> $env:GITHUB_ENV
          'OPENSSL_RUST_USE_NASM=1' >> $env:GITHUB_ENV
          $tools.PerlDirectory >> $env:GITHUB_PATH
          $tools.NasmDirectory >> $env:GITHUB_PATH
      - name: Verify native Unix OpenSSL build tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc --version
          make --version
          perl -MLocale::Maketext::Simple -e 'print "$^V $^O\n"'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Verify native architecture
        shell: bash
        run: |
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Debug tests
        run: cargo test --locked --all-targets
      - name: Release tests and build timings
        run: cargo test --locked --release --all-targets --timings
      - name: Verify dependency license notices
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 tools/collect_rust_notices.py --check

  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python tooling tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify pinned Unicode data generation
        run: python3 tools/generate_unicode_names.py --check
